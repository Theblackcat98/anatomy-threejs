<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>{{TITLE}}</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --anatomy-bg: #f3f2ee;
      --anatomy-card: #faf9f5;
      --anatomy-paper: #faf9f5;
      --anatomy-border: #dfddd5;
      --anatomy-text: #181715;
      --anatomy-muted: #78746c;
      --anatomy-strong: #0c0b0a;
      --anatomy-lit: #d97706;
      --anatomy-pill-bg: #efede7;
      --anatomy-pill-hover: #e4e1d8;
      --anatomy-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --anatomy-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--anatomy-bg);
      color: var(--anatomy-text);
      font-family: var(--anatomy-sans);
      transition: background-color 0.25s ease, color 0.25s ease;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      height: 100dvh;
    }

    .wrapper {
      width: 100%;
      max-width: 1600px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .figure-card {
      position: relative;
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      background-color: var(--anatomy-card);
      border: 1px solid var(--anatomy-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.04);
      transition: background-color 0.25s ease, border-color 0.25s ease;
      outline: none;
    }

    .figure-card:focus-visible {
      border-color: var(--anatomy-lit);
    }

    #canvas-host {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #canvas-host:active {
      cursor: grabbing;
    }

    #canvas-host canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    .hud-detail {
      transition: opacity 0.22s ease, transform 0.22s ease;
    }

    body.hud-hidden .figure-card .hud-detail {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(4px);
    }

    body.hud-hidden .caption-bar {
      display: none;
    }

    .corner {
      position: absolute;
      z-index: 3;
      pointer-events: none;
      font-family: var(--anatomy-mono);
      font-size: 11px;
      letter-spacing: 0.05em;
      line-height: 1.45;
      color: var(--anatomy-muted);
      background-color: color-mix(in srgb, var(--anatomy-card) 78%, transparent);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      padding: 4px 8px;
      border-radius: 6px;
    }

    .corner.top-left {
      top: 12px;
      left: 12px;
      font-weight: 600;
      color: var(--anatomy-text);
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .corner.top-right {
      top: 12px;
      right: 52px;
      text-align: right;
      text-transform: uppercase;
    }

    .corner.bottom-left {
      bottom: 12px;
      left: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 5px;
      max-width: calc(100% - 24px);
    }

    .corner.bottom-right {
      bottom: 12px;
      right: 12px;
      text-align: right;
      color: var(--anatomy-text);
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }

    .hud-quick-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 4;
      width: 32px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--anatomy-border);
      background-color: color-mix(in srgb, var(--anatomy-card) 85%, transparent);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: var(--anatomy-text);
      font-family: var(--anatomy-mono);
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    }

    .hud-quick-btn:hover {
      background-color: var(--anatomy-pill-bg);
    }

    .hud-quick-btn.active {
      border-color: var(--anatomy-lit);
      color: var(--anatomy-lit);
    }

    .accent-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--anatomy-lit);
      flex-shrink: 0;
      transition: background-color 0.25s ease;
    }

    kbd {
      display: inline-block;
      padding: 1px 5px;
      font-family: var(--anatomy-mono);
      font-size: 10px;
      color: var(--anatomy-text);
      background-color: var(--anatomy-pill-bg);
      border: 1px solid var(--anatomy-border);
      border-radius: 4px;
      line-height: 1.3;
    }

    .engraved-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .engraved-tag {
      position: absolute;
      font-family: var(--anatomy-mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      color: var(--anatomy-muted);
      opacity: 0.8;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .controls-bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background-color: var(--anatomy-card);
      border: 1px solid var(--anatomy-border);
      border-radius: 12px;
      padding: 8px 12px;
      transition: background-color 0.25s ease, border-color 0.25s ease;
    }

    .scheme-group,
    .params-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .sliders-group {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .scheme-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid transparent;
      background-color: var(--anatomy-pill-bg);
      color: var(--anatomy-text);
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .scheme-btn:hover {
      background-color: var(--anatomy-pill-hover);
    }

    .scheme-btn.active {
      border-color: var(--anatomy-lit);
      background-color: var(--anatomy-card);
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(128, 128, 128, 0.4);
      flex-shrink: 0;
    }

    .slider-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--anatomy-mono);
      font-size: 11px;
      color: var(--anatomy-muted);
      margin-right: 2px;
    }

    input[type="range"] {
      width: 82px;
      accent-color: var(--anatomy-lit);
      cursor: pointer;
    }

    .action-btn {
      padding: 5px 9px;
      border-radius: 7px;
      border: 1px solid var(--anatomy-border);
      background-color: transparent;
      color: var(--anatomy-text);
      font-family: var(--anatomy-mono);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .action-btn:hover {
      background-color: var(--anatomy-pill-bg);
    }

    .action-btn.active {
      border-color: var(--anatomy-lit);
      color: var(--anatomy-lit);
      background-color: var(--anatomy-pill-bg);
    }

    .caption-bar {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 0 4px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--anatomy-muted);
    }

    .caption-bar strong {
      color: var(--anatomy-text);
      font-weight: 600;
    }

    .legend-strip {
      display: inline-flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      font-family: var(--anatomy-mono);
      font-size: 11px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .legend-swatch {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }

    .desktop-hint {
      display: inline;
    }
    .mobile-hint {
      display: none;
    }

    @media (max-width: 768px) {
      body {
        padding: 6px;
      }
      .wrapper {
        gap: 6px;
      }
      .desktop-hint {
        display: none;
      }
      .mobile-hint {
        display: inline;
      }
      .corner {
        font-size: 9.5px;
        padding: 3px 6px;
      }
      .corner.bottom-left {
        bottom: 36px;
      }
      .corner.bottom-right {
        bottom: 8px;
        right: 8px;
      }
      .controls-bar {
        padding: 7px 8px;
        gap: 6px;
      }
      .scheme-group,
      .params-group {
        width: 100%;
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .sliders-group {
        flex-wrap: nowrap;
        flex-shrink: 0;
      }
      .scheme-group::-webkit-scrollbar,
      .params-group::-webkit-scrollbar {
        display: none;
      }
      .caption-bar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper iso-plate">
    <div class="figure-card" id="figure-card" tabindex="0" aria-label="{{ARIA_LABEL}}">
      <div id="canvas-host"></div>

      <button type="button" class="hud-quick-btn active" id="hud-quick-btn" title="Toggle Floating Details (H)" aria-label="Toggle Floating Details">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>

      <div class="engraved-layer hud-detail" id="engraved-layer">
        {{ENGRAVED_TAGS_HTML}}
      </div>

      <div class="corner top-left hud-detail">
        <span class="accent-dot"></span>
        <span>{{FIG_LABEL}}</span>
      </div>
      <div class="corner top-right hud-detail" id="phase-corner">{{INITIAL_PHASE}}</div>

      <div class="corner bottom-left hud-detail">
        <span class="desktop-hint">
          <span id="hint-interact"></span>Drag orbit · Right-drag pan · Scroll zoom · <span id="hint-crank"><kbd>Shift</kbd>+Drag crank · </span><span id="hint-explode"><kbd>E</kbd> apart · </span><kbd>H</kbd> details · <kbd>R</kbd> iso
        </span>
        <span class="mobile-hint">
          <span id="hint-interact-mobile"></span>1-finger orbit · 2-finger pan &amp; pinch zoom · Tap DETAILS to hide HUD
        </span>
      </div>

      <div class="corner bottom-right hud-detail" id="readout" data-readout aria-live="polite">
        {{INITIAL_READOUT}}
      </div>
    </div>

    <div class="controls-bar">
      <div class="scheme-group" id="scheme-buttons" aria-label="Anatomy color themes"></div>
      <div class="params-group">
        <div class="sliders-group" id="custom-sliders">
          <label class="slider-label" title="Shaft speed">
            <span>RPM</span>
            <input type="range" id="rpm-slider" min="0" max="2400" step="20" value="720" />
          </label>
        </div>
        <button type="button" class="action-btn" id="crank-btn" title="1-finger drag cranks the engine shaft">CRANK</button>
        <button type="button" class="action-btn" id="slow-btn" title="Shortcut: S">SLOW 1×</button>
        <button type="button" class="action-btn" id="explode-btn" title="Shortcut: E">APART</button>
        <button type="button" class="action-btn active" id="cutaway-btn" title="Shortcut: C">CUTAWAY</button>
        <button type="button" class="action-btn active" id="shader-btn" title="Shortcut: I">SHADER</button>
        <button type="button" class="action-btn active" id="hud-btn" title="Shortcut: H">DETAILS</button>
        <button type="button" class="action-btn" id="reset-btn" title="Shortcut: R">RESET</button>
      </div>
    </div>

    <div class="caption-bar hud-detail">
      <div>{{CAPTION_HTML}}</div>
      <div class="legend-strip">
        {{LEGEND_HTML}}
      </div>
    </div>
  </div>

  <script>
    (function () {
{{BUNDLE_SCRIPT}}
    })();
  </script>
</body>
</html>
